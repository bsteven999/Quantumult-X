name: Auto Update Rules

on:
  schedule:
    - cron: '0 0 * * *'  # 每日 UTC 00:00 (台灣時間 08:00) 自動執行
  workflow_dispatch:      # 支援手動觸發

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run convert scripts
        run: |
          python scripts/convert_porn.py
          python scripts/convert_ai.py

      - name: Update README with timestamp & links
        run: |
          # 取得台灣時間 (日期與時間)
          UPDATED_AT=$(TZ="Asia/Taipei" date "+%Y-%m-%d %H:%M:%S")
          
          # 精準匹配並替換冒號後方的所有文字
          sed -i "s/\(\* \*\*最後自動同步時間\*\*：\).*/\1 ${UPDATED_AT}/g" README.md
          
      - name: Commit & Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add rules/ README.md
          git diff-index --quiet HEAD || git commit -m "Auto update QX rules & README [skip ci]"
          git push
